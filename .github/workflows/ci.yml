name: Vibe OS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Python Telemetry E2E Tests
        run: |
          python3 tests/e2e_telemetry_test.py

      - name: Verify Backend Go Build
        run: |
          cd backend-go
          go vet ./... || true
